  const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=noiseBuffer;filter.type='bandpass';filter.frequency.setValueAtTime(1600,now);filter.frequency.exponentialRampToValueAtTime(260,now+1.8);filter.Q.value=.55;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.2,now+.035);gain.gain.exponentialRampToValueAtTime(.0001,now+1.85);src.connect(filter).connect(gain).connect(audio.destination);src.start(now);src.stop(now+1.9);
  [0,.11,.23].forEach((t,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=[170,128,96][i];g.gain.setValueAtTime(.08,now+t);g.gain.exponentialRampToValueAtTime(.0001,now+t+.28);o.connect(g).connect(audio.destination);o.start(now+t);o.stop(now+t+.3)})
}
function playReady(){if(muted)return;initAudio();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;[440,554,659].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.06);g.gain.exponentialRampToValueAtTime(.06,now+i*.06+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.06+.23);o.connect(g).connect(audio.destination);o.start(now+i*.06);o.stop(now+i*.06+.24)})}
function crackToy(){if(state!=='ready')return;state='cracked';crackStart=performance.now();crumbleBtn.textContent='BURST IT!';statusEl.textContent=`A surprise is hiding inside`;hint.textContent='Tap again for the big burst!';playCrack()}
function burstToy(){if(state!=='cracked')return;state='falling';start=performance.now();last=start;crumbleBtn.disabled=true;crumbleBtn.textContent='WHOOSH!';statusEl.textContent='Watch the surprise pop out!';hint.textContent='Sparkles and sand!';sparkles=Array.from({length:18},(_,i)=>({a:(Math.PI*2*i/18)+(Math.random()-.5)*.14,dist:45+Math.random()*74,size:3+Math.random()*4,spin:Math.random()*Math.PI,color:i%3===0?'#ffffff':i%2?'#ffe56f':'#76edff'}));playCrumble();playSparkle()}
function tapToy(){if(state==='ready')crackToy();else if(state==='cracked')burstToy()}
function update(now){
  if(state!=='falling')return;const elapsed=now-start,dt=Math.min((now-last)/16.67,2);last=now;
  for(const p of particles){if(!p.active&&elapsed>=p.delay){p.active=true;p.vx=((p.ox-180)/180)*1.6+(Math.random()-.5)*2.8;p.vy=-1.1-Math.random()*2.8}
    if(p.active&&!p.settled){p.vy+=.245*dt;p.vx+=Math.sin((p.y+elapsed*.04)*.025)*.018*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const ground=floorY-3-Math.random()*2;if(p.y>ground){p.y=ground-Math.random()*16;p.vx*=.3;p.vy=0;p.settled=true}}
  }
  if(elapsed>2600){const pileW=Math.min(150*origin.s,W*.34),pileH=40*origin.s;for(const p of particles){const dx=(Math.random()+Math.random()+Math.random()-1.5)*pileW;p.active=true;p.x=W/2+dx;p.y=floorY-3-Math.random()*pileH*Math.max(.08,1-Math.abs(dx)/pileW);p.settled=true}state='done';crumbleBtn.disabled=false;crumbleBtn.textContent='BUILD IT AGAIN';statusEl.textContent=`You found ${surprises[shape].name}!`;hint.textContent='Pick another toy, or build it again'}
}
function drawBackground(now){
  const dark=darkQuery.matches;const g=ctx.createLinearGradient(0,0,0,H);if(dark){g.addColorStop(0,'#18213e');g.addColorStop(.58,'#633f65');g.addColorStop(1,'#c47b63')}else{g.addColorStop(0,'#77cbd4');g.addColorStop(.55,'#f6b884');g.addColorStop(1,'#e99167')}ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=dark?.75:.55;ctx.fillStyle=dark?'#fff4c5':'#fff8d9';ctx.beginPath();ctx.arc(W*.82,H*.18,Math.min(W,H)*.065,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  if(dark){ctx.fillStyle='#f7e8c8';for(let i=0;i<28;i++){const x=(i*97%1000)/1000*W,y=(i*61%320)/1000*H;ctx.globalAlpha=.3+(i%4)*.16;ctx.fillRect(x,y,1.5+(i%2),1.5+(i%2))}ctx.globalAlpha=1}
  ctx.fillStyle=dark?'#805569':'#d98360';ctx.beginPath();ctx.moveTo(0,floorY-38);ctx.bezierCurveTo(W*.18,floorY-115,W*.36,floorY-20,W*.55,floorY-68);ctx.bezierCurveTo(W*.75,floorY-120,W*.86,floorY-56,W,floorY-82);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  ctx.fillStyle=dark?'#a76b6d':'#ed9f68';ctx.beginPath();ctx.moveTo(0,floorY-14);ctx.bezierCurveTo(W*.25,floorY-73,W*.38,floorY+12,W*.62,floorY-30);ctx.bezierCurveTo(W*.8,floorY-62,W*.92,floorY-5,W,floorY-35);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  ctx.fillStyle=dark?'#c48a76':'#f4bd79';ctx.fillRect(0,floorY,W,H-floorY);
  const glow=ctx.createRadialGradient(W/2,floorY-30,0,W/2,floorY-30,Math.min(W,500));glow.addColorStop(0,dark?'rgba(255,206,145,.18)':'rgba(255,244,180,.35)');glow.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=glow;ctx.fillRect(0,floorY-240,W,260);
}
function drawParticles(){for(const p of particles){if(!p.active)continue;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r)}}
function drawToy(now){
  if(!shapeCanvas)return;let angle=0,shift=0;if(state==='cracked'&&!reduced){const age=now-crackStart;if(age<760){const fade=1-age/760;angle=Math.sin(age*.075)*.055*fade;shift=Math.sin(age*.12)*4*fade}}
  ctx.save();ctx.imageSmoothingEnabled=true;ctx.translate(origin.x+180*origin.s+shift,origin.y+190*origin.s);ctx.rotate(angle);ctx.drawImage(shapeCanvas,-180*origin.s,-190*origin.s,360*origin.s,380*origin.s);if(state==='cracked')ctx.drawImage(crackCanvas,-180*origin.s,-190*origin.s,360*origin.s,380*origin.s);ctx.restore();
}
function drawStar(c,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:r*.45;i?c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):c.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath()}
function drawSurprise(now){
  if(state!=='falling'&&state!=='done')return;const item=surprises[shape],elapsed=state==='done'?2600:Math.max(0,now-start),t=Math.min(1,elapsed/720),ease=1-Math.pow(1-t,3),targetY=floorY-76-Math.sin(now*.006)*4,fromY=origin.y+195*origin.s,y=fromY+(targetY-fromY)*ease,scale=(.22+.78*Math.min(1,t*1.8))*Math.min(1,Math.max(.15,W/440));
  ctx.save();ctx.translate(W/2,y);ctx.scale(scale,scale);ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowColor='rgba(255,244,163,.8)';ctx.shadowBlur=22;
  if(item.type==='star'){ctx.fillStyle=item.color;drawStar(ctx,38);ctx.fill();ctx.strokeStyle='#b76536';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle=item.accent;ctx.beginPath();ctx.arc(-10,-9,7,0,Math.PI*2);ctx.fill()}
  else if(item.type==='alien'){ctx.fillStyle=item.color;ctx.beginPath();ctx.ellipse(0,0,31,38,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#34584b';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#263c4c';ctx.beginPath();ctx.ellipse(-11,-3,7,11,-.25,0,Math.PI*2);ctx.ellipse(11,-3,7,11,.25,0,Math.PI*2);ctx.fill();ctx.strokeStyle=item.accent;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,11,10,.22,Math.PI-.22);ctx.stroke();ctx.strokeStyle='#34584b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-16,-29);ctx.lineTo(-23,-42);ctx.moveTo(16,-29);ctx.lineTo(23,-42);ctx.stroke();ctx.fillStyle=item.accent;ctx.beginPath();ctx.arc(-23,-43,5,0,Math.PI*2);ctx.arc(23,-43,5,0,Math.PI*2);ctx.fill()}
  else if(item.type==='heartGem'){ctx.fillStyle=item.color;ctx.beginPath();ctx.moveTo(0,38);ctx.bezierCurveTo(-10,25,-38,6,-35,-15);ctx.bezierCurveTo(-32,-36,-9,-39,0,-21);ctx.bezierCurveTo(9,-39,32,-36,35,-15);ctx.bezierCurveTo(38,6,10,25,0,38);ctx.closePath();ctx.fill();ctx.strokeStyle='#8e3e68';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle=item.accent;ctx.beginPath();ctx.ellipse(-13,-18,8,12,-.65,0,Math.PI*2);ctx.fill()}
  else{ctx.fillStyle=item.color;ctx.beginPath();ctx.moveTo(0,-42);ctx.lineTo(34,-14);ctx.lineTo(21,31);ctx.lineTo(0,43);ctx.lineTo(-21,31);ctx.lineTo(-34,-14);ctx.closePath();ctx.fill();ctx.strokeStyle='#346a91';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle=item.accent;ctx.beginPath();ctx.moveTo(0,-33);ctx.lineTo(0,33);ctx.lineTo(-25,-11);ctx.closePath();ctx.fill()}
  ctx.restore();
}
function drawSparkles(now){
  if(state!=='falling'||!sparkles.length)return;const age=now-start;if(age>1450)return;const t=Math.min(1,age/900),cx=W/2,cy=(origin.y+195*origin.s)+(floorY-76-(origin.y+195*origin.s))*(1-Math.pow(1-Math.min(1,age/720),3));ctx.save();ctx.globalAlpha=Math.max(0,1-age/1450);
  for(const s of sparkles){const d=s.dist*(.25+.75*t),x=cx+Math.cos(s.a)*d,y=cy+Math.sin(s.a)*d;ctx.save();ctx.translate(x,y);ctx.rotate(s.spin+age*.004);ctx.fillStyle=s.color;drawStar(ctx,s.size);ctx.fill();ctx.restore()}ctx.restore();
}
function draw(now){drawBackground(now);update(now);if(state==='ready'||state==='cracked')drawToy(now);else{drawParticles();drawSurprise(now);drawSparkles(now)}requestAnimationFrame(draw)}
function choose(next){shape=next;picks.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.shape===shape)));setOrigin();buildShape();playReady()}
picks.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.shape)));
crumbleBtn.addEventListener('click',()=>state==='done'?choose(shape):tapToy());
canvas.addEventListener('pointerdown',e=>{if(state!=='ready'&&state!=='cracked')return;const x=(e.clientX-origin.x)/origin.s,y=(e.clientY-origin.y)/origin.s;if(x>-10&&x<370&&y>-10&&y<390)tapToy()});
soundBtn.addEventListener('click',()=>{muted=!muted;soundBtn.setAttribute('aria-pressed',String(!muted));soundBtn.setAttribute('aria-label',muted?'Turn sound on':'Turn sound off');soundBtn.textContent=muted?'Sound off':'Sound on';soundBtn.dataset.short=muted?'×':'♪';if(!muted)playReady()});
addEventListener('resize',resize);darkQuery.addEventListener&&darkQuery.addEventListener('change',()=>{});resize();requestAnimationFrame(draw);
})();
</script>
