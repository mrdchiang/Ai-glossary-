<!doctype html>
<html lang="en">
<head>
<!-- pwa-tags -->
<meta name="pwa-tags" content="yes">

<link rel="manifest" href="manifest.json">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#8ed8ef" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <title>Stacking Blocks</title>
  <style>
    :root {
      color-scheme: light dark;
      --sky-top: #82d6ee;
      --sky-bottom: #d8f3dc;
      --ink: #183345;
      --ink-soft: #2e5667;
      --cloud: rgba(255,255,255,.84);
      --hill-back: #75c987;
      --hill-front: #3da66a;
      --ground: #237d53;
      --shelf: #f6ca6d;
      --shelf-edge: #d99a45;
      --panel: rgba(255,255,255,.82);
      --button: rgba(255,255,255,.9);
      --button-press: #fff4cc;
      --shadow: rgba(19,74,73,.2);
      --outline: #153a4a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sky-top: #172b50;
        --sky-bottom: #315a68;
        --ink: #f5fbff;
        --ink-soft: #ddf1f8;
        --cloud: rgba(220,240,255,.22);
        --hill-back: #35664e;
        --hill-front: #224f3c;
        --ground: #163d30;
        --shelf: #b8793b;
        --shelf-edge: #7e4d2b;
        --panel: rgba(12,31,45,.78);
        --button: rgba(246,251,255,.92);
        --button-press: #ffe5a3;
        --shadow: rgba(0,0,0,.35);
        --outline: #102d3a;
      }
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: "Nunito", sans-serif;
      color: var(--ink);
      background: var(--sky-top);
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    button { font: inherit; }
    .game {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 460px;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 70%);
      touch-action: none;
      isolation: isolate;
    }
    .sky-decor { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .sun {
      position: absolute; width: 92px; height: 92px; border-radius: 50%;
      right: 10%; top: 14%; background: #ffd45a; box-shadow: 0 0 0 12px rgba(255,212,90,.18);
    }
    .cloud { position: absolute; width: 118px; height: 34px; border-radius: 30px; background: var(--cloud); }
    .cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
    .cloud::before { width: 48px; height: 48px; left: 19px; bottom: 2px; }
    .cloud::after { width: 60px; height: 60px; right: 15px; bottom: 0; }
    .cloud.one { left: 5%; top: 25%; transform: scale(.72); }
    .cloud.two { right: 3%; top: 35%; transform: scale(.5); opacity: .72; }
    .hills { position: absolute; left: -5%; right: -5%; bottom: 110px; height: 160px; pointer-events: none; }
    .hill { position: absolute; bottom: 0; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
    .hill.a { width: 65%; height: 130px; left: -5%; background: var(--hill-back); }
    .hill.b { width: 70%; height: 105px; right: -8%; background: var(--hill-front); }
    .header {
      position: relative; z-index: 20;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
      padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left));
      pointer-events: none;
    }
    .intro {
      max-width: min(470px, calc(100vw - 154px));
      padding: 10px 14px 11px;
      border-radius: 20px 20px 20px 7px;
      background: var(--panel);
      box-shadow: 0 5px 0 rgba(29,89,92,.12);
      backdrop-filter: blur(8px);
    }
    h1 { font-family: "Fredoka", sans-serif; font-size: clamp(26px, 5vw, 44px); line-height: .95; margin: 0; letter-spacing: -.035em; }
    .hint { margin: 6px 0 0; color: var(--ink-soft); font-size: clamp(13px, 2vw, 17px); line-height: 1.2; font-weight: 800; }
    .controls { display: flex; gap: 9px; pointer-events: auto; }
    .round-button {
      width: 54px; height: 54px; border: 0; border-radius: 18px;
      color: #173b4c; background: var(--button);
      box-shadow: 0 5px 0 var(--shadow), inset 0 0 0 2px rgba(255,255,255,.5);
      display: grid; place-items: center; cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .round-button svg { width: 29px; height: 29px; stroke-width: 2.4; }
    .round-button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); background: var(--button-press); }
    .round-button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }
    .round-button[aria-pressed="false"] .sound-on { display: none; }
    .round-button[aria-pressed="true"] .sound-off { display: none; }
    .world { position: absolute; inset: 0; z-index: 5; }
    .ground-line {
      position: absolute; left: 0; right: 0; bottom: 110px; height: 8px;
      background: var(--ground); box-shadow: 0 5px 0 rgba(11,66,42,.16);
      z-index: 2;
    }
    .block {
      position: absolute;
      border: 3px solid var(--outline);
      box-shadow: 0 6px 0 rgba(12,54,61,.2), inset 0 4px 0 rgba(255,255,255,.4);
      display: grid; place-items: center;
      cursor: grab;
      touch-action: none;
      z-index: 9;
      transform-origin: 50% 50%;
      transition: filter .15s ease, box-shadow .15s ease;
      will-change: transform, left, top;
    }
    .block.dragging { cursor: grabbing; filter: brightness(1.08); z-index: 30; box-shadow: 0 12px 0 rgba(12,54,61,.16), inset 0 4px 0 rgba(255,255,255,.45); }
    .block.landed { animation: thump .22s ease-out; }
    @keyframes thump { 45% { filter: brightness(1.16); } }
    .block.crashing { filter: saturate(1.15); }
    .block .dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.7); border: 2px solid rgba(20,54,65,.18); }
    .block .stripe { width: 72%; height: 9px; border-radius: 12px; background: rgba(255,255,255,.62); transform: rotate(-9deg); }
    .block .arch { width: 36px; height: 22px; border: 6px solid rgba(255,255,255,.68); border-bottom: 0; border-radius: 22px 22px 0 0; align-self: end; margin-bottom: -3px; }
    .shelf {
      position: absolute; z-index: 15; left: 0; right: 0; bottom: 0; height: 110px;
      padding: 14px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: var(--shelf);
      border-top: 7px solid var(--shelf-edge);
      box-shadow: 0 -7px 18px rgba(38,76,58,.15);
      display: flex; justify-content: center; align-items: flex-start; gap: clamp(10px, 3vw, 26px);
    }
    .pick {
      position: relative; width: clamp(64px, 19vw, 112px); height: 66px;
      border: 0; padding: 0; background: transparent; cursor: grab; touch-action: none;
    }
    .pick:focus-visible { outline: 4px solid #fff; outline-offset: 3px; border-radius: 12px; }
    .sample { left: 50%; top: 50%; transform: translate(-50%,-50%); pointer-events: none; }
    .celebrate {
      position: absolute; z-index: 40; left: 50%; top: 29%; transform: translate(-50%,-50%) scale(.6) rotate(-3deg);
      font-family: "Fredoka", sans-serif; font-size: clamp(36px, 9vw, 74px); font-weight: 700; color: #fff;
      text-shadow: 0 5px 0 #e54c60, 0 8px 18px rgba(16,43,56,.25);
      opacity: 0; pointer-events: none; white-space: nowrap;
    }
    .celebrate.show { animation: cheer 1.8s cubic-bezier(.18,.86,.3,1) both; }
    @keyframes cheer { 0% { opacity: 0; transform: translate(-50%,-40%) scale(.45) rotate(-6deg); } 15%,70% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(2deg); } 100% { opacity: 0; transform: translate(-50%,-65%) scale(1.08) rotate(0); } }
    .spark { position: absolute; z-index: 35; width: 12px; height: 12px; border-radius: 3px; pointer-events: none; animation: sparkle .9s ease-out forwards; }
    @keyframes sparkle { to { transform: translate(var(--dx), var(--dy)) rotate(190deg) scale(.1); opacity: 0; } }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 520px) {
      .header { gap: 8px; }
      .intro { padding: 9px 11px 10px; }
      .hint { max-width: 230px; }
      .round-button { width: 48px; height: 48px; border-radius: 15px; }
      .controls { gap: 7px; }
      .sun { width: 68px; height: 68px; top: 20%; }
      .cloud.one { top: 30%; left: -4%; }
    }
    @media (max-height: 560px) {
      .hint { display: none; }
      .intro { padding: 9px 12px; }
      .shelf { height: 92px; padding-top: 8px; }
      .ground-line { bottom: 92px; }
      .hills { bottom: 92px; }
      .pick { height: 58px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .block.landed, .celebrate.show, .spark { animation-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main class="game" id="game" aria-label="A block stacking playground">
    <div class="sky-decor" aria-hidden="true">
      <div class="sun"></div><div class="cloud one"></div><div class="cloud two"></div>
      <div class="hills"><div class="hill a"></div><div class="hill b"></div></div>
    </div>

    <header class="header">
      <div class="intro">
        <h1>Build it tall!</h1>
        <p class="hint" id="hint">Grab a block. Stack it up. How high can you go?</p>
      </div>
      <div class="controls">
        <button class="round-button" id="soundButton" type="button" aria-label="Turn sound off" aria-pressed="true">
          <svg class="sound-on" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13v6h5l7 6V7l-7 6H5Z"/><path d="M22 12c2 2 2 6 0 8M25.5 8.5c4.2 4.2 4.2 10.8 0 15"/></svg>
          <svg class="sound-off" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13v6h5l7 6V7l-7 6H5Z"/><path d="m22 13 6 6m0-6-6 6"/></svg>
        </button>
        <button class="round-button" id="crashButton" type="button" aria-label="Crash all the blocks">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 25h18M10 25v-6h12v6M13 19v-5h6v5M16 14V7"/><path d="m12 9 4-4 4 4"/></svg>
        </button>
      </div>
    </header>

    <section class="world" id="world" aria-label="Building area">
      <div class="ground-line" aria-hidden="true"></div>
    </section>
    <div class="celebrate" id="celebrate" aria-hidden="true">Wow!</div>
    <div class="shelf" id="shelf" aria-label="Block shelf"></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      "use strict";
      var game = document.getElementById("game");
      var world = document.getElementById("world");
      var shelf = document.getElementById("shelf");
      var soundButton = document.getElementById("soundButton");
      var crashButton = document.getElementById("crashButton");
      var celebrate = document.getElementById("celebrate");
      var status = document.getElementById("status");
      var blocks = [];
      var active = null;
      var audio = null;
      var soundOn = true;
      var nextId = 1;
      var celebrated = false;
      var shelfHeight = window.innerHeight < 560 ? 92 : 110;
      var lastFrame = performance.now();
      var gravity = 1850;
      var physicsRunning = true;
      var colors = ["#f15b64", "#ff9f43", "#ffd84f", "#53c77a", "#45b7df", "#8c72d9", "#ef71ae"];
      var shapes = [
        { w: 96, h: 48, radius: 9, deco: "dot" },
        { w: 74, h: 62, radius: 12, deco: "stripe" },
        { w: 112, h: 40, radius: 8, deco: "arch" },
        { w: 62, h: 62, radius: 15, deco: "dot" }
      ];

      function groundY() { return game.clientHeight - shelfHeight - 7; }
      function ensureAudio() {
        if (!audio) {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audio = new Ctx();
        }
        if (audio && audio.state === "suspended") audio.resume();
      }
      function tone(freq, duration, type, volume, delay) {
        if (!soundOn) return;
        ensureAudio();
        if (!audio) return;
        var t = audio.currentTime + (delay || 0);
        var osc = audio.createOscillator();
        var gain = audio.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(freq * .78, t + duration);
        gain.gain.setValueAtTime(.0001, t);
        gain.gain.exponentialRampToValueAtTime(volume || .07, t + .015);
        gain.gain.exponentialRampToValueAtTime(.0001, t + duration);
        osc.connect(gain); gain.connect(audio.destination);
        osc.start(t); osc.stop(t + duration + .03);
      }
      function landingSound(height) {
        tone(210 + Math.min(340, height * 13), .18, "sine", .07, 0);
        tone(315 + Math.min(400, height * 16), .12, "triangle", .035, .045);
      }
      function crashSound() {
        [150, 125, 96, 72].forEach(function (f, i) { tone(f, .28, "square", .025, i * .07); });
      }
      function cheerSound() {
        [392, 523, 659, 784].forEach(function (f, i) { tone(f, .25, "sine", .055, i * .1); });
      }

      function makeDecor(el, kind) {
        var d = document.createElement("span");
        d.className = kind;
        el.appendChild(d);
      }
      function makeBlock(spec, color, x, y, placed) {
        var el = document.createElement("div");
        el.className = "block";
        el.setAttribute("role", "img");
        el.setAttribute("aria-label", colorName(color) + " building block");
        el.style.width = spec.w + "px";
        el.style.height = spec.h + "px";
        el.style.borderRadius = spec.radius + "px";
        el.style.background = color;
        el.style.left = x + "px";
        el.style.top = y + "px";
        makeDecor(el, spec.deco);
        world.appendChild(el);
        var block = {
          id: nextId++, el: el, x: x, y: y, w: spec.w, h: spec.h,
          color: color, spec: spec, placed: !!placed,
          vx: 0, vy: 0, angle: 0, av: 0,
          sleeping: !!placed, stillTime: 0, landedNotified: !!placed,
          lastPX: 0, lastPY: 0, lastMoveAt: 0
        };
        bindBlock(block);
        return block;
      }
      function colorName(color) {
        var names = {"#f15b64":"red", "#ff9f43":"orange", "#ffd84f":"yellow", "#53c77a":"green", "#45b7df":"blue", "#8c72d9":"purple", "#ef71ae":"pink"};
        return names[color] || "colorful";
      }
      function scaledSpec(spec) {
        var max = Math.min(112, Math.max(72, game.clientWidth * .26));
        if (spec.w <= max) return { w: spec.w, h: spec.h, radius: spec.radius, deco: spec.deco };
        var s = max / spec.w;
        return { w: Math.round(spec.w*s), h: Math.round(spec.h*s), radius: spec.radius, deco: spec.deco };
      }
      function buildShelf() {
        shelf.innerHTML = "";
        shapes.forEach(function (shape, i) {
          var spec = scaledSpec(shape);
          var button = document.createElement("button");
          button.className = "pick";
          button.type = "button";
          button.setAttribute("aria-label", "Pick up a " + colorName(colors[i]) + " block");
          var sample = document.createElement("span");
          sample.className = "block sample";
          sample.style.width = spec.w + "px";
          sample.style.height = spec.h + "px";
          sample.style.borderRadius = spec.radius + "px";
          sample.style.background = colors[i];
          makeDecor(sample, spec.deco);
          button.appendChild(sample);
          button.addEventListener("pointerdown", function (e) { startFromShelf(e, spec, colors[i]); });
          button.addEventListener("click", function (e) {
            if (e.detail === 0) keyboardDrop(spec, colors[i]);
          });
          shelf.appendChild(button);
        });
      }
      function bindBlock(block) {
        block.el.addEventListener("pointerdown", function (e) {
          if (active || block.crashing) return;
          e.preventDefault();
          ensureAudio();
          var index = blocks.indexOf(block);
          if (index >= 0) blocks.splice(index, 1);
          active = block;
          block.placed = false;
          block.sleeping = false;
          block.stillTime = 0;
          block.vx = 0; block.vy = 0; block.av = 0;
          block.el.classList.remove("landed");
          block.el.classList.add("dragging");
          block.el.setPointerCapture(e.pointerId);
          block.pointerId = e.pointerId;
          block.lastPX = e.clientX;
          block.lastPY = e.clientY;
          block.lastMoveAt = performance.now();
          moveActive(e.clientX, e.clientY);
          wakeAll();
        });
        block.el.addEventListener("pointermove", dragMove);
        block.el.addEventListener("pointerup", dropActive);
        block.el.addEventListener("pointercancel", dropActive);
      }
      function startFromShelf(e, spec, color) {
        if (active) return;
        e.preventDefault();
        ensureAudio();
        tone(430, .08, "sine", .035, 0);
        var block = makeBlock(spec, color, e.clientX - spec.w/2, e.clientY - spec.h/2, false);
        active = block;
        block.el.classList.add("dragging");
        block.el.setPointerCapture(e.pointerId);
        block.pointerId = e.pointerId;
        block.lastPX = e.clientX;
        block.lastPY = e.clientY;
        block.lastMoveAt = performance.now();
        moveActive(e.clientX, e.clientY);
      }
      function keyboardDrop(spec, color) {
        if (active) return;
        ensureAudio();
        var x = game.clientWidth/2 - spec.w/2 + (Math.random()-.5)*35;
        var block = makeBlock(spec, color, x, 115, false);
        active = block;
        block.vx = (Math.random()-.5) * 90;
        block.av = (Math.random()-.5) * 1.6;
        settleBlock(block);
      }
      function dragMove(e) {
        if (!active || e.pointerId !== active.pointerId) return;
        e.preventDefault();
        moveActive(e.clientX, e.clientY);
      }
      function moveActive(px, py) {
        if (!active) return;
        var now = performance.now();
        var dt = Math.max(8, now - active.lastMoveAt) / 1000;
        var nextX = Math.max(3, Math.min(game.clientWidth - active.w - 3, px - active.w/2));
        var nextY = Math.max(10, Math.min(groundY() - active.h - 2, py - active.h*.58));
        if (active.lastMoveAt) {
          active.vx = active.vx*.55 + ((px-active.lastPX)/dt)*.45;
          active.vy = active.vy*.55 + ((py-active.lastPY)/dt)*.45;
        }
        active.vx = Math.max(-900, Math.min(900, active.vx));
        active.vy = Math.max(-900, Math.min(900, active.vy));
        active.x = nextX; active.y = nextY;
        active.lastPX = px; active.lastPY = py; active.lastMoveAt = now;
        active.angle *= .78;
        renderBlock(active);
      }
      function dropActive(e) {
        if (!active || (e && e.pointerId !== active.pointerId)) return;
        if (e) e.preventDefault();
        settleBlock(active);
      }
      function settleBlock(block) {
        block.el.classList.remove("dragging");
        if (performance.now() - block.lastMoveAt > 110) {
          block.vx *= .18;
          block.vy *= .18;
        }
        block.vx = Math.max(-650, Math.min(650, block.vx));
        block.vy = Math.max(-480, Math.min(700, block.vy));
        block.av += block.vx / Math.max(90, block.w) * .7;
        block.sleeping = false;
        block.stillTime = 0;
        block.landedNotified = false;
        block.placed = true;
        if (blocks.indexOf(block) < 0) blocks.push(block);
        active = null;
        wakeAll();
      }
      function renderBlock(block) {
        block.el.style.left = block.x + "px";
        block.el.style.top = block.y + "px";
        block.el.style.transform = "rotate(" + (block.angle * 57.2958) + "deg)";
      }
      function wakeAll() {
        blocks.forEach(function (b) {
          b.sleeping = false;
          b.stillTime = 0;
        });
      }
      function horizontalOverlap(a, b) {
        return Math.min(a.x+a.w, b.x+b.w) - Math.max(a.x, b.x);
      }
      function stepBlock(block, dt) {
        if (block.sleeping || block === active) return;
        var prevY = block.y;
        var previousSpeed = block.vy;
        block.vy += gravity * dt;
        block.x += block.vx * dt;
        block.y += block.vy * dt;
        block.angle += block.av * dt;
        block.vx *= Math.pow(.993, dt*60);
        block.av *= Math.pow(.994, dt*60);

        if (block.x < 2) {
          block.x = 2; block.vx = Math.abs(block.vx)*.42; block.av += 1.4;
        } else if (block.x + block.w > game.clientWidth-2) {
          block.x = game.clientWidth-block.w-2; block.vx = -Math.abs(block.vx)*.42; block.av -= 1.4;
        }

        var floor = groundY();
        var contactY = floor;
        var support = null;
        var bestTop = floor;
        blocks.forEach(function (other) {
          if (other === block || other === active || other.crashing) return;
          var overlap = horizontalOverlap(block, other);
          if (overlap < 5) return;
          var oldBottom = prevY + block.h;
          var newBottom = block.y + block.h;
          if (oldBottom <= other.y + 9 && newBottom >= other.y && other.y < bestTop) {
            bestTop = other.y;
            contactY = other.y;
            support = other;
          }
        });

        var touching = block.y + block.h >= contactY;
        if (touching) {
          block.y = contactY - block.h;
          var impact = Math.max(0, previousSpeed);
          block.vy = impact > 150 ? -impact*.13 : 0;
          block.vx *= support ? .76 : .68;
          var leftEdge = support ? support.x : 0;
          var rightEdge = support ? support.x+support.w : game.clientWidth;
          var center = block.x + block.w/2;
          var edgePad = Math.min(9, (rightEdge-leftEdge)*.14);
          var stable = center > leftEdge+edgePad && center < rightEdge-edgePad;

          if (stable) {
            block.av += -block.angle * 19 * dt;
            block.av *= Math.pow(.72, dt*60);
            if (Math.abs(block.angle) < .018 && Math.abs(block.av) < .12) {
              block.angle = 0; block.av = 0;
            }
            if (Math.abs(block.vx) < 7 && Math.abs(block.vy) < 7 && Math.abs(block.av) < .16) {
              block.stillTime += dt;
              if (block.stillTime > .42) {
                block.sleeping = true;
                block.vx = 0; block.vy = 0; block.av = 0; block.angle = 0;
              }
            } else block.stillTime = 0;
          } else {
            var direction = center <= leftEdge+edgePad ? -1 : 1;
            block.vx += direction * 620 * dt;
            block.av += direction * 7.2 * dt;
            block.y += 1.5;
            block.stillTime = 0;
          }

          if (!block.landedNotified && impact > 45) {
            block.landedNotified = true;
            finishLanding(block);
          }
        } else {
          block.stillTime = 0;
        }
        renderBlock(block);
      }
      function physicsFrame(now) {
        var dt = Math.min(.034, Math.max(.001, (now-lastFrame)/1000));
        lastFrame = now;
        var half = dt/2;
        blocks.slice().sort(function(a,b){ return b.y-a.y; }).forEach(function(b){ stepBlock(b, half); });
        blocks.slice().sort(function(a,b){ return b.y-a.y; }).forEach(function(b){ stepBlock(b, half); });
        if (physicsRunning) requestAnimationFrame(physicsFrame);
      }
      function stackHeight(block) {
        var count = 1, cursor = block, guard = 0;
        while (guard++ < 50) {
          var under = null, closest = Infinity;
          blocks.forEach(function (b) {
            if (b === cursor) return;
            var overlap = Math.min(cursor.x+cursor.w, b.x+b.w)-Math.max(cursor.x,b.x);
            var gap = b.y - (cursor.y+cursor.h);
            if (overlap > 15 && gap >= -3 && gap < closest && gap < 8) { closest = gap; under = b; }
          });
          if (!under) break;
          count++; cursor = under;
        }
        return count;
      }
      function finishLanding(block) {
        block.placed = true;
        block.el.classList.add("landed");
        setTimeout(function(){ block.el.classList.remove("landed"); }, 350);
        var height = stackHeight(block);
        landingSound(height);
        burst(block.x + block.w/2, block.y + 4, height >= 4 ? 10 : 5);
        status.textContent = height > 1 ? "A stack of " + height + " blocks!" : "Block landed!";
        if ((height >= 6 || block.y < 150) && !celebrated) {
          celebrated = true;
          celebrate.textContent = height >= 8 ? "So tall!" : "Wow!";
          celebrate.classList.remove("show");
          void celebrate.offsetWidth;
          celebrate.classList.add("show");
          cheerSound();
          burst(game.clientWidth/2, Math.max(120, block.y+20), 28);
        }
      }
      function burst(x, y, count) {
        var palette = ["#ffd84f", "#f15b64", "#45b7df", "#ffffff", "#8c72d9"];
        for (var i=0; i<count; i++) {
          var s = document.createElement("i");
          s.className = "spark";
          s.style.left = (x-6) + "px"; s.style.top = (y-6) + "px";
          s.style.background = palette[i%palette.length];
          var angle = (Math.PI*2*i/count) + Math.random()*.35;
          var dist = 35 + Math.random()*78;
          s.style.setProperty("--dx", Math.cos(angle)*dist + "px");
          s.style.setProperty("--dy", Math.sin(angle)*dist + "px");
          game.appendChild(s);
          setTimeout(function (node) { node.remove(); }, 950, s);
        }
      }
      function crashAll() {
        if (!blocks.length || active) return;
        ensureAudio(); crashSound();
        status.textContent = "Crash! Build another tower.";
        var center = game.clientWidth/2;
        blocks.forEach(function (block, i) {
          var direction = block.x+block.w/2 < center ? -1 : 1;
          if (Math.abs(block.x+block.w/2-center) < 22) direction = i%2 ? -1 : 1;
          block.crashing = true;
          block.sleeping = false;
          block.stillTime = 0;
          block.vx = direction * (190 + Math.random()*360);
          block.vy = -(330 + Math.random()*420);
          block.av = direction * (4 + Math.random()*8);
          block.el.classList.add("crashing");
        });
        celebrated = false;
        setTimeout(function(){
          var old = blocks.slice(); blocks.length = 0;
          old.forEach(function(b){ b.el.remove(); });
          seedBase();
        }, 2200);
      }
      function seedBase() {
        if (blocks.length) return;
        var spec = scaledSpec({ w: 124, h: 38, radius: 8, deco: "stripe" });
        var x = game.clientWidth/2 - spec.w/2;
        var b = makeBlock(spec, "#45b7df", x, groundY()-spec.h, true);
        b.landedNotified = true;
        renderBlock(b);
        blocks.push(b);
      }
      soundButton.addEventListener("click", function () {
        soundOn = !soundOn;
        soundButton.setAttribute("aria-pressed", String(soundOn));
        soundButton.setAttribute("aria-label", soundOn ? "Turn sound off" : "Turn sound on");
        if (soundOn) { ensureAudio(); tone(523, .16, "sine", .06, 0); }
      });
      crashButton.addEventListener("click", crashAll);
      window.addEventListener("resize", function () {
        shelfHeight = window.innerHeight < 560 ? 92 : 110;
        buildShelf();
        var floor = groundY();
        blocks.forEach(function (b) {
          b.x = Math.max(3, Math.min(game.clientWidth-b.w-3, b.x));
          if (b.y+b.h > floor) b.y = floor-b.h;
          b.sleeping = false; b.stillTime = 0;
          renderBlock(b);
        });
      });
      buildShelf();
      seedBase();
      requestAnimationFrame(physicsFrame);
    }());
  </script>
</body>
</html>
