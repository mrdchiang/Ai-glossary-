<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Particle Galaxy</title>
  <style>
    :root {
      color-scheme: light dark;
      --sky: #06152b;
      --sky-edge: #020a18;
      --ink: #f8fbff;
      --muted: #bdd0e6;
      --panel: rgba(4, 15, 33, .72);
      --panel-line: rgba(205, 229, 255, .22);
      --button: rgba(238, 247, 255, .12);
      --button-pressed: rgba(238, 247, 255, .23);
      --focus: #ffe784;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sky: #020611;
        --sky-edge: #000105;
        --ink: #f9fbff;
        --muted: #b9c9e2;
        --panel: rgba(2, 5, 14, .76);
        --panel-line: rgba(201, 220, 255, .2);
        --button: rgba(230, 240, 255, .11);
        --button-pressed: rgba(230, 240, 255, .22);
        --focus: #fff09e;
      }
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 44%, var(--sky), var(--sky-edge) 78%);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    main { position: relative; width: 100%; height: 100%; min-height: 320px; isolation: isolate; }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .hint {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: max(22px, calc(env(safe-area-inset-top) + 14px));
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 32px);
      margin: 0;
      padding: 10px 15px 11px;
      border: 1px solid var(--panel-line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      font-size: clamp(13px, 2.8vw, 16px);
      font-weight: 650;
      letter-spacing: .01em;
      text-align: center;
      box-shadow: 0 10px 34px rgba(0, 0, 0, .22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: none;
      transition: opacity .65s ease, transform .65s ease;
    }
    .hint span { color: var(--muted); font-weight: 520; }
    .hint.is-hidden { opacity: 0; transform: translate(-50%, -10px); }
    .game-hud {
      position: absolute;
      z-index: 3;
      left: max(14px, env(safe-area-inset-left));
      top: max(16px, calc(env(safe-area-inset-top) + 10px));
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 126px;
      padding: 9px 12px 10px;
      border: 1px solid var(--panel-line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 10px 34px rgba(0, 0, 0, .22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: none;
    }
    .game-hud svg { width: 31px; height: 31px; color: #ffe271; filter: drop-shadow(0 0 7px rgba(255, 210, 70, .72)); }
    .score-copy { display: grid; grid-template-columns: auto auto; align-items: baseline; column-gap: 5px; }
    .score-copy strong { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
    .score-copy span { color: var(--muted); font-size: 11px; font-weight: 700; }
    .jar { grid-column: 1 / -1; display: flex; gap: 3px; margin-top: 5px; }
    .jar i { width: 10px; height: 5px; border-radius: 4px; background: rgba(255,255,255,.2); transition: background .18s ease, box-shadow .18s ease; }
    .jar i.is-filled { background: #ffe271; box-shadow: 0 0 6px rgba(255, 215, 80, .85); }
    .celebration {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 31%;
      transform: translate(-50%, -50%) scale(.8);
      margin: 0;
      color: #fff6b6;
      font-size: clamp(28px, 8vw, 54px);
      font-weight: 800;
      letter-spacing: -.03em;
      text-align: center;
      text-shadow: 0 0 18px rgba(255, 204, 63, .72), 0 3px 14px rgba(0,0,0,.65);
      opacity: 0;
      pointer-events: none;
    }
    .celebration.is-showing { animation: celebrate 1.35s ease-out both; }
    @keyframes celebrate {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.55) rotate(-4deg); }
      18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(2deg); }
      68% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -62%) scale(.94); }
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .controls {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--panel-line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 16px 48px rgba(0, 0, 0, .32);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 16px;
      min-width: 72px;
      min-height: 58px;
      padding: 7px 12px 8px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .015em;
      cursor: pointer;
      display: grid;
      place-items: center;
      gap: 4px;
    }
    button:hover { background: var(--button); }
    button:active { background: var(--button-pressed); transform: translateY(1px); }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    button svg { width: 25px; height: 25px; display: block; overflow: visible; }
    #tempo[aria-pressed="true"] { background: var(--button-pressed); }
    @media (max-width: 520px) {
      .hint { top: max(84px, calc(env(safe-area-inset-top) + 78px)); }
    }
    @media (max-width: 390px) {
      .controls { gap: 2px; padding: 5px; }
      button { min-width: 64px; min-height: 54px; padding-inline: 9px; }
      button svg { width: 23px; height: 23px; }
    }
    @media (max-height: 470px) {
      .controls { left: auto; right: 10px; transform: none; bottom: 10px; flex-direction: column; }
      button { min-width: 58px; min-height: 48px; padding: 5px 9px; }
      button svg { width: 20px; height: 20px; }
      .hint { left: 154px; top: 16px; transform: none; }
      .hint.is-hidden { transform: translateY(-8px); }
      .game-hud { top: 10px; left: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hint, .jar i { transition-duration: .01ms; }
      .celebration.is-showing { animation-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main aria-label="Star Catcher game in an interactive particle galaxy.">
    <canvas id="galaxy" tabindex="0" role="application" aria-label="Star Catcher canvas. Tap the large flying stars to catch them. Drag to swirl the galaxy. Press Space to catch a flying star."></canvas>

    <div class="game-hud" id="gameHud" role="status" aria-label="0 stars caught">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="m16 2.8 3.9 8 8.8 1.3-6.4 6.2 1.5 8.8-7.8-4.2-7.8 4.2 1.5-8.8-6.4-6.2 8.8-1.3z" fill="currentColor" stroke="#fff6be" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <div class="score-copy"><strong id="score">0</strong><span>stars</span><div class="jar" id="jar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
    </div>
    <p class="hint" id="hint">Tap the flying stars! <span>Fill your star jar</span></p>
    <p class="celebration" id="celebration" aria-hidden="true">Star shower!</p>
    <div class="sr-only" id="announce" aria-live="polite"></div>

    <div class="controls" aria-label="Galaxy controls">
      <button id="color" type="button" aria-label="Change galaxy colors">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <circle cx="14" cy="14" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="11" cy="9" r="2" fill="#ff78c8"/><circle cx="18" cy="11" r="2" fill="#65ddff"/>
          <circle cx="10" cy="17" r="2" fill="#ffd86b"/><path d="M17 17.2c2.7 0 3.8 3.1 1.4 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Color</span>
      </button>
      <button id="tempo" type="button" aria-label="Turn turbo mode on" aria-pressed="false">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <path d="M15.4 2.8 6.7 15.1h6.5l-1 10.1 9.1-13.6h-6.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
        </svg>
        <span>Turbo</span>
      </button>
      <button id="reset" type="button" aria-label="Reset Star Catcher game">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <path d="M5.2 10.1A9.4 9.4 0 1 1 5 18.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M4.8 4.9v5.5h5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Reset</span>
      </button>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      var canvas = document.getElementById('galaxy');
      var ctx = canvas.getContext('2d', { alpha: false });
      var hint = document.getElementById('hint');
      var status = document.getElementById('announce');
      var scoreNode = document.getElementById('score');
      var gameHud = document.getElementById('gameHud');
      var jarDots = document.querySelectorAll('#jar i');
      var celebrationNode = document.getElementById('celebration');
      var colorButton = document.getElementById('color');
      var tempoButton = document.getElementById('tempo');
      var resetButton = document.getElementById('reset');
      var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var palettes = [
        { core: '#fff7d8', a: 202, b: 327, c: 44, name: 'Cosmic candy' },
        { core: '#f4fbff', a: 183, b: 222, c: 276, name: 'Blue nebula' },
        { core: '#fff1bd', a: 24, b: 346, c: 53, name: 'Solar flare' },
        { core: '#efffd4', a: 107, b: 168, c: 56, name: 'Alien garden' }
      ];
      var paletteIndex = 0;
      var particles = [];
      var bursts = [];
      var trails = [];
      var shootingStars = [];
      var pointers = new Map();
      var W = 0, H = 0, dpr = 1, cx = 0, cy = 0, galaxyRadius = 1;
      var lastTime = performance.now();
      var turbo = false;
      var interacted = false;
      var frame = 0;
      var starsCaught = 0;
      var spawnClock = 0;
      var starId = 0;

      function randomNormal() {
        return (Math.random() + Math.random() + Math.random() + Math.random() - 2) / 2;
      }

      function makeParticle(i, total) {
        var t = Math.pow(Math.random(), 0.61);
        var arm = i % 4;
        var spread = randomNormal() * (0.2 + t * 0.34);
        var angle = arm * Math.PI / 2 + t * 8.9 + spread;
        var hueChoice = Math.random();
        var p = palettes[paletteIndex];
        var hue = hueChoice < .42 ? p.a : (hueChoice < .8 ? p.b : p.c);
        return {
          r: 5 + t * galaxyRadius * .94,
          angle: angle,
          speed: (.08 + (1 - t) * .28) * (Math.random() < .12 ? 1.18 : 1),
          yScale: .49 + Math.random() * .1,
          ox: 0,
          oy: 0,
          vx: 0,
          vy: 0,
          size: .45 + Math.pow(Math.random(), 4) * 2.15 + (1 - t) * .35,
          alpha: .28 + Math.random() * .7,
          hue: hue,
          twinkle: Math.random() * Math.PI * 2,
          drift: (Math.random() - .5) * .014,
          hot: t < .16 || Math.random() < .055
        };
      }

      function updateHud() {
        scoreNode.textContent = String(starsCaught);
        gameHud.setAttribute('aria-label', starsCaught + (starsCaught === 1 ? ' star caught' : ' stars caught'));
        var filled = starsCaught === 0 ? 0 : ((starsCaught - 1) % 5) + 1;
        for (var i = 0; i < jarDots.length; i++) jarDots[i].classList.toggle('is-filled', i < filled);
      }

      function spawnShootingStar(delay) {
        if (W < 2 || H < 2) return;
        var fromLeft = Math.random() > .5;
        var margin = 54;
        var usableTop = Math.max(105, H * .17);
        var usableBottom = Math.max(usableTop + 80, H - Math.max(112, H * .17));
        var y = usableTop + Math.random() * Math.max(60, usableBottom - usableTop);
        var speed = (82 + Math.random() * 38 + Math.min(48, starsCaught * 2.2)) * (reducedMotion ? .62 : 1);
        shootingStars.push({
          id: ++starId,
          x: fromLeft ? -margin : W + margin,
          y: y,
          vx: fromLeft ? speed : -speed,
          vy: (Math.random() - .5) * 16,
          radius: W < 480 ? 25 : 28,
          spin: Math.random() * Math.PI * 2,
          pulse: Math.random() * Math.PI * 2,
          hue: Math.random() > .24 ? 48 : palettes[paletteIndex].a
        });
        spawnClock = delay === undefined ? Math.max(.85, 2.05 - starsCaught * .035) : delay;
      }

      function celebrateMilestone() {
        celebrationNode.classList.remove('is-showing');
        void celebrationNode.offsetWidth;
        celebrationNode.classList.add('is-showing');
        status.textContent = starsCaught + ' stars caught. Star shower!';
        for (var i = 0; i < 5; i++) {
          window.setTimeout(function () {
            var x = W * (.2 + Math.random() * .6);
            var y = H * (.2 + Math.random() * .38);
            supernova(x, y, .48);
          }, i * 90);
        }
      }

      function catchStar(x, y) {
        var best = -1;
        var bestDistance = Infinity;
        for (var i = 0; i < shootingStars.length; i++) {
          var star = shootingStars[i];
          var dx = star.x - x, dy = star.y - y;
          var distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < star.radius + 24 && distance < bestDistance) {
            best = i;
            bestDistance = distance;
          }
        }
        if (best < 0) return false;
        var caught = shootingStars.splice(best, 1)[0];
        starsCaught++;
        updateHud();
        supernova(caught.x, caught.y, .74);
        for (var j = 0; j < 16; j++) {
          var a = Math.random() * Math.PI * 2;
          var s = 2 + Math.random() * 5;
          trails.push({ x: caught.x, y: caught.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hue: j % 3 ? 48 : caught.hue, size: 2 + Math.random() * 3 });
        }
        status.textContent = starsCaught + (starsCaught === 1 ? ' star caught!' : ' stars caught!');
        spawnClock = Math.min(spawnClock, .34);
        if (starsCaught % 5 === 0) celebrateMilestone();
        return true;
      }

      function rebuild() {
        var area = W * H;
        var target = Math.floor(Math.min(W > 720 ? 1750 : 1150, Math.max(680, area / 520)));
        particles = [];
        for (var i = 0; i < target; i++) particles.push(makeParticle(i, target));
        bursts = [];
        trails = [];
        shootingStars = [];
        spawnShootingStar(.55);
      }

      function resize() {
        var rect = canvas.getBoundingClientRect();
        W = Math.max(1, rect.width);
        H = Math.max(1, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx = W * .5;
        cy = H * (W < 600 ? .44 : .47);
        galaxyRadius = Math.min(W * .53, H * .57, 460);
        rebuild();
      }

      function particlePosition(pt) {
        var cos = Math.cos(pt.angle), sin = Math.sin(pt.angle);
        var tilt = -.14;
        var x0 = cos * pt.r;
        var y0 = sin * pt.r * pt.yScale;
        return {
          x: cx + x0 * Math.cos(tilt) - y0 * Math.sin(tilt) + pt.ox,
          y: cy + x0 * Math.sin(tilt) + y0 * Math.cos(tilt) + pt.oy
        };
      }

      function background() {
        var bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * .76);
        if (darkMode) {
          bg.addColorStop(0, '#081126'); bg.addColorStop(.43, '#020813'); bg.addColorStop(1, '#000105');
        } else {
          bg.addColorStop(0, '#0b2342'); bg.addColorStop(.48, '#041329'); bg.addColorStop(1, '#010817');
        }
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, galaxyRadius * .9);
        var p = palettes[paletteIndex];
        glow.addColorStop(0, 'hsla(' + p.a + ', 92%, 66%, .14)');
        glow.addColorStop(.3, 'hsla(' + p.b + ', 86%, 60%, .055)');
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(cx - galaxyRadius, cy - galaxyRadius, galaxyRadius * 2, galaxyRadius * 2);
      }

      function stir(x, y, dx, dy, strength) {
        var radius = Math.min(W, H) * .24 + 35;
        var r2 = radius * radius;
        for (var i = 0; i < particles.length; i++) {
          var pt = particles[i];
          var pos = particlePosition(pt);
          var px = pos.x - x, py = pos.y - y;
          var dist2 = px * px + py * py;
          if (dist2 < r2 && dist2 > 4) {
            var dist = Math.sqrt(dist2);
            var falloff = (1 - dist / radius) * strength;
            var tx = -py / dist, ty = px / dist;
            pt.vx += (dx * .11 + tx * 2.2) * falloff;
            pt.vy += (dy * .11 + ty * 2.2) * falloff;
          }
        }
        trails.push({ x: x, y: y, life: 1, hue: palettes[paletteIndex].a, size: 18 + strength * 12 });
      }

      function supernova(x, y, power) {
        var radius = 170 * power;
        for (var i = 0; i < particles.length; i++) {
          var pt = particles[i];
          var pos = particlePosition(pt);
          var dx = pos.x - x, dy = pos.y - y;
          var dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (dist < radius) {
            var push = (1 - dist / radius) * 8.5 * power;
            pt.vx += dx / dist * push;
            pt.vy += dy / dist * push;
          }
        }
        var p = palettes[paletteIndex];
        bursts.push({ x: x, y: y, life: 1, hue: p.b, power: power, spokes: 22 });
        for (var j = 0; j < 18; j++) {
          var a = Math.random() * Math.PI * 2;
          var s = 1.5 + Math.random() * 5 * power;
          trails.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hue: j % 2 ? p.a : p.c, size: 2 + Math.random() * 3 });
        }
      }

      function update(dt) {
        var speedFactor = turbo ? 2.35 : 1;
        if (reducedMotion) speedFactor *= .45;
        for (var i = 0; i < particles.length; i++) {
          var pt = particles[i];
          pt.angle += (pt.speed / Math.max(48, pt.r * .53) + pt.drift * .05) * dt * speedFactor;
          pt.ox += pt.vx * dt * 60;
          pt.oy += pt.vy * dt * 60;
          var spring = .024 * dt * 60;
          pt.vx += -pt.ox * spring * .016;
          pt.vy += -pt.oy * spring * .016;
          var damping = Math.pow(.945, dt * 60);
          pt.vx *= damping;
          pt.vy *= damping;
          pt.twinkle += dt * (1 + pt.size * .7) * speedFactor;
        }
        spawnClock -= dt;
        if (spawnClock <= 0 && shootingStars.length < (W > 720 ? 3 : 2)) spawnShootingStar();
        for (var s = shootingStars.length - 1; s >= 0; s--) {
          var star = shootingStars[s];
          star.x += star.vx * dt * (turbo ? 1.22 : 1);
          star.y += star.vy * dt;
          star.spin += dt * (star.vx > 0 ? 1.35 : -1.35);
          star.pulse += dt * 4.8;
          if ((star.vx > 0 && star.x > W + 74) || (star.vx < 0 && star.x < -74)) {
            shootingStars.splice(s, 1);
            spawnClock = Math.min(spawnClock, .38);
          }
        }
        for (var b = bursts.length - 1; b >= 0; b--) {
          bursts[b].life -= dt * .72;
          if (bursts[b].life <= 0) bursts.splice(b, 1);
        }
        for (var t = trails.length - 1; t >= 0; t--) {
          var trail = trails[t];
          trail.life -= dt * (trail.vx === undefined ? 1.8 : .88);
          if (trail.vx !== undefined) {
            trail.x += trail.vx * dt * 60;
            trail.y += trail.vy * dt * 60;
            trail.vx *= .988; trail.vy *= .988;
          }
          if (trail.life <= 0) trails.splice(t, 1);
        }
      }

      function traceStar(x, y, outer, inner, rotation) {
        ctx.beginPath();
        for (var i = 0; i < 10; i++) {
          var radius = i % 2 === 0 ? outer : inner;
          var angle = rotation - Math.PI / 2 + i * Math.PI / 5;
          var px = x + Math.cos(angle) * radius;
          var py = y + Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
      }

      function drawShootingStars() {
        for (var i = 0; i < shootingStars.length; i++) {
          var star = shootingStars[i];
          var direction = star.vx > 0 ? 1 : -1;
          var pulse = 1 + Math.sin(star.pulse) * .08;
          var tailLength = 82 + Math.abs(star.vx) * .14;
          var tail = ctx.createLinearGradient(star.x - direction * tailLength, star.y, star.x, star.y);
          tail.addColorStop(0, 'rgba(255,221,91,0)');
          tail.addColorStop(.6, 'hsla(' + star.hue + ',100%,70%,.24)');
          tail.addColorStop(1, 'rgba(255,248,187,.92)');
          ctx.strokeStyle = tail;
          ctx.lineWidth = star.radius * .34;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(star.x - direction * tailLength, star.y - star.vy * .22);
          ctx.lineTo(star.x - direction * 7, star.y);
          ctx.stroke();

          var glow = ctx.createRadialGradient(star.x, star.y, 1, star.x, star.y, star.radius * 1.8);
          glow.addColorStop(0, 'rgba(255,255,232,.94)');
          glow.addColorStop(.26, 'hsla(' + star.hue + ',100%,68%,.62)');
          glow.addColorStop(1, 'rgba(255,205,54,0)');
          ctx.fillStyle = glow;
          ctx.beginPath(); ctx.arc(star.x, star.y, star.radius * 1.8, 0, Math.PI * 2); ctx.fill();

          traceStar(star.x, star.y, star.radius * pulse, star.radius * .48 * pulse, star.spin);
          ctx.fillStyle = '#ffe06a';
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,225,.96)';
          ctx.lineWidth = 2.2;
          ctx.stroke();
          traceStar(star.x - star.radius * .17, star.y - star.radius * .18, star.radius * .34, star.radius * .14, star.spin);
          ctx.fillStyle = 'rgba(255,255,240,.9)';
          ctx.fill();
        }
      }

      function draw() {
        background();
        ctx.globalCompositeOperation = 'lighter';
        var p = palettes[paletteIndex];

        var halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, 56);
        halo.addColorStop(0, p.core);
        halo.addColorStop(.08, 'hsla(' + p.c + ', 100%, 78%, .8)');
        halo.addColorStop(.35, 'hsla(' + p.a + ', 96%, 65%, .23)');
        halo.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = halo;
        ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI * 2); ctx.fill();

        for (var i = 0; i < particles.length; i++) {
          var pt = particles[i];
          var pos = particlePosition(pt);
          if (pos.x < -10 || pos.x > W + 10 || pos.y < -10 || pos.y > H + 10) continue;
          var flicker = .78 + Math.sin(pt.twinkle) * .22;
          var alpha = pt.alpha * flicker;
          var size = pt.size * (turbo ? .9 : 1);
          ctx.fillStyle = pt.hot ? 'rgba(255,250,224,' + alpha + ')' : 'hsla(' + pt.hue + ', 94%, 72%, ' + alpha + ')';
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, Math.max(.38, size), 0, Math.PI * 2);
          ctx.fill();
          if (size > 1.7 && frame % 2 === 0) {
            ctx.strokeStyle = 'hsla(' + pt.hue + ', 100%, 82%, ' + alpha * .34 + ')';
            ctx.lineWidth = .55;
            ctx.beginPath();
            ctx.moveTo(pos.x - size * 2.8, pos.y); ctx.lineTo(pos.x + size * 2.8, pos.y);
            ctx.moveTo(pos.x, pos.y - size * 2.8); ctx.lineTo(pos.x, pos.y + size * 2.8);
            ctx.stroke();
          }
        }

        drawShootingStars();

        for (var j = 0; j < trails.length; j++) {
          var tr = trails[j];
          ctx.fillStyle = 'hsla(' + tr.hue + ', 100%, 74%, ' + Math.max(0, tr.life * .75) + ')';
          ctx.beginPath(); ctx.arc(tr.x, tr.y, Math.max(.8, tr.size * tr.life), 0, Math.PI * 2); ctx.fill();
        }

        for (var k = 0; k < bursts.length; k++) {
          var burst = bursts[k];
          var progress = 1 - burst.life;
          var radius = 16 + progress * 145 * burst.power;
          ctx.strokeStyle = 'hsla(' + burst.hue + ', 100%, 78%, ' + burst.life * .78 + ')';
          ctx.lineWidth = 2.4 * burst.life + .5;
          ctx.beginPath(); ctx.arc(burst.x, burst.y, radius, 0, Math.PI * 2); ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,' + burst.life * .38 + ')';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(burst.x, burst.y, radius * .62, 0, Math.PI * 2); ctx.stroke();
          var flash = ctx.createRadialGradient(burst.x, burst.y, 0, burst.x, burst.y, 48 * burst.power);
          flash.addColorStop(0, 'rgba(255,255,255,' + burst.life * .86 + ')');
          flash.addColorStop(.22, 'hsla(' + burst.hue + ',100%,72%,' + burst.life * .5 + ')');
          flash.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = flash;
          ctx.beginPath(); ctx.arc(burst.x, burst.y, 48 * burst.power, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
      }

      function animate(now) {
        var dt = Math.min(.034, Math.max(.001, (now - lastTime) / 1000));
        lastTime = now;
        update(dt);
        draw();
        frame++;
        requestAnimationFrame(animate);
      }

      function markInteracted() {
        if (interacted) return;
        interacted = true;
        hint.classList.add('is-hidden');
      }

      function pointerPoint(e) {
        var rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      canvas.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        canvas.setPointerCapture(e.pointerId);
        var point = pointerPoint(e);
        pointers.set(e.pointerId, { x: point.x, y: point.y, startX: point.x, startY: point.y, time: performance.now(), moved: false });
        stir(point.x, point.y, 0, 0, 1.15);
        markInteracted();
      });

      canvas.addEventListener('pointermove', function (e) {
        var old = pointers.get(e.pointerId);
        if (!old) return;
        e.preventDefault();
        var point = pointerPoint(e);
        var dx = point.x - old.x, dy = point.y - old.y;
        if (Math.abs(point.x - old.startX) + Math.abs(point.y - old.startY) > 7) old.moved = true;
        stir(point.x, point.y, dx, dy, Math.min(2.2, .75 + Math.sqrt(dx * dx + dy * dy) / 11));
        old.x = point.x; old.y = point.y;
      });

      function endPointer(e) {
        var old = pointers.get(e.pointerId);
        if (!old) return;
        if (!old.moved && performance.now() - old.time < 650) {
          if (!catchStar(old.x, old.y)) supernova(old.x, old.y, 1);
        }
        pointers.delete(e.pointerId);
      }
      canvas.addEventListener('pointerup', endPointer);
      canvas.addEventListener('pointercancel', function (e) { pointers.delete(e.pointerId); });

      canvas.addEventListener('keydown', function (e) {
        if (e.code === 'Space') {
          e.preventDefault();
          markInteracted();
          if (shootingStars.length) catchStar(shootingStars[0].x, shootingStars[0].y);
        } else if (e.code === 'Enter') {
          e.preventDefault();
          markInteracted();
          supernova(cx, cy, 1.35);
          status.textContent = 'Supernova!';
        }
      });

      colorButton.addEventListener('click', function () {
        paletteIndex = (paletteIndex + 1) % palettes.length;
        var p = palettes[paletteIndex];
        for (var i = 0; i < particles.length; i++) {
          var choice = Math.random();
          particles[i].hue = choice < .42 ? p.a : (choice < .8 ? p.b : p.c);
        }
        supernova(cx, cy, .8);
        markInteracted();
        status.textContent = p.name + ' colors';
      });

      tempoButton.addEventListener('click', function () {
        turbo = !turbo;
        tempoButton.setAttribute('aria-pressed', String(turbo));
        tempoButton.setAttribute('aria-label', turbo ? 'Turn turbo mode off' : 'Turn turbo mode on');
        markInteracted();
        status.textContent = turbo ? 'Turbo mode on' : 'Turbo mode off';
      });

      resetButton.addEventListener('click', function () {
        starsCaught = 0;
        updateHud();
        rebuild();
        supernova(cx, cy, .65);
        markInteracted();
        status.textContent = 'Star Catcher reset';
      });

      window.addEventListener('resize', resize, { passive: true });
      var scheme = window.matchMedia('(prefers-color-scheme: dark)');
      if (scheme.addEventListener) scheme.addEventListener('change', function (e) { darkMode = e.matches; });
      resize();
      requestAnimationFrame(animate);
      window.setTimeout(function () { if (!interacted) hint.classList.add('is-hidden'); }, 7000);
    }());
  </script>
</body>
</html>
