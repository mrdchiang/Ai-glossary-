<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Planet Pop</title>
  <style>
    :root{
      color-scheme:light dark;
      --ink:#132a46;
      --page:#07152f;
      --panel:#10264b;
      --rail:#f7fbff;
      --line:rgba(255,255,255,.18);
      --shadow:rgba(0,0,0,.28);
    }
    @media (prefers-color-scheme:dark){
      :root{--ink:#eef7ff;--page:#030918;--panel:#0b1831;--rail:#152746;--line:rgba(255,255,255,.12);--shadow:rgba(0,0,0,.48)}
    }
    *{box-sizing:border-box}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    html,body{margin:0;min-height:100%;overflow-x:hidden}
    body{
      min-height:100svh;
      color:var(--ink);
      background:
        radial-gradient(circle at 18% 14%,rgba(255,255,255,.8) 0 1.5px,transparent 2px),
        radial-gradient(circle at 83% 25%,rgba(255,255,255,.6) 0 2px,transparent 2.5px),
        radial-gradient(circle at 55% 78%,rgba(114,174,255,.45) 0 1.5px,transparent 2px),
        var(--page);
      background-size:78px 78px,121px 121px,93px 93px,auto;
      overscroll-behavior:none;
      -webkit-tap-highlight-color:transparent;
    }
    button{font:inherit;color:inherit}
    .app{
      width:min(100%,760px);
      min-height:100svh;
      margin:auto;
      display:grid;
      grid-template-rows:1fr auto;
      gap:16px;
      padding:clamp(14px,3vw,24px) clamp(10px,3vw,22px) max(14px,env(safe-area-inset-bottom));
    }
    .stage{
      position:relative;
      min-height:390px;
      overflow:hidden;
      border-radius:42px 42px 30px 30px;
      background:var(--panel);
      box-shadow:0 18px 50px var(--shadow),inset 0 0 0 2px rgba(255,255,255,.16);
      isolation:isolate;
    }
    .scene{
      position:absolute;inset:0;
      display:grid;place-items:center;
      opacity:0;transform:scale(.9);
      pointer-events:none;
      transition:opacity .28s ease,transform .58s cubic-bezier(.17,.89,.32,1.35);
    }
    .scene.active{opacity:1;transform:scale(1);pointer-events:auto}
    .scene[hidden]{display:none}
    .scene-bg{position:absolute;inset:0;overflow:hidden;z-index:-1}
    .scene-bg:after{
      content:"";position:absolute;inset:0;opacity:.48;
      background:
        radial-gradient(circle at 11% 18%,#fff 0 2px,transparent 3px),
        radial-gradient(circle at 83% 14%,#fff 0 1.5px,transparent 2.5px),
        radial-gradient(circle at 72% 75%,#fff 0 2px,transparent 3px),
        radial-gradient(circle at 24% 80%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 91% 48%,#fff 0 1px,transparent 2px);
    }
    .sun-bg{background:radial-gradient(circle at 50% 52%,#8b3024 0,#3d1731 49%,#180c29 100%)}
    .earth-bg{background:radial-gradient(circle at 50% 55%,#2488aa 0,#123f72 52%,#081a3a 100%)}
    .mars-bg{background:radial-gradient(circle at 50% 55%,#aa4a32 0,#512337 50%,#1b132c 100%)}
    .jupiter-bg{background:radial-gradient(circle at 50% 55%,#9f6841 0,#4a3340 50%,#17152b 100%)}
    .saturn-bg{background:radial-gradient(circle at 50% 55%,#867349 0,#393348 52%,#12152b 100%)}
    .neptune-bg{background:radial-gradient(circle at 50% 55%,#254fba 0,#182d75 51%,#0b1234 100%)}
    .orbit{position:absolute;border:2px solid rgba(255,255,255,.14);border-radius:50%;transform:rotate(-18deg)}
    .orbit.one{width:86%;height:42%;left:7%;top:28%}.orbit.two{width:62%;height:62%;left:19%;top:18%;transform:rotate(22deg)}
    .planet-button{
      width:min(76vw,410px);aspect-ratio:1;
      border:0;background:transparent;padding:0;cursor:pointer;
      display:grid;place-items:center;touch-action:manipulation;
    }
    .planet-button svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 22px 16px rgba(0,0,0,.3))}
    .planet-button:active{transform:scale(.96)}
    .planet-button:focus-visible{outline:5px solid #fff;outline-offset:-10px;border-radius:50%}
    .stage.boop .active .planet-art{animation:boop .68s cubic-bezier(.22,1.65,.42,1)}
    @keyframes boop{0%{transform:scale(1)}30%{transform:scale(.78) rotate(-5deg)}68%{transform:scale(1.14) rotate(4deg)}100%{transform:scale(1)}}
    .float{animation:float 2.3s ease-in-out infinite alternate;transform-origin:center}
    @keyframes float{to{transform:translateY(-11px) rotate(2deg)}}
    .sun-ray{transform-origin:200px 200px;animation:spin 16s linear infinite}
    .earth-cloud{animation:cloud 2.8s ease-in-out infinite alternate}
    .jupiter-band{animation:band 2s ease-in-out infinite alternate}
    .saturn-ring{transform-origin:200px 200px;animation:ring 2.4s ease-in-out infinite alternate}
    .neptune-storm{animation:storm 2s ease-in-out infinite alternate}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes cloud{to{transform:translateX(8px)}}
    @keyframes band{to{transform:translateX(-5px)}}
    @keyframes ring{to{transform:rotate(2deg) scale(1.02)}}
    @keyframes storm{to{transform:translateX(10px) scaleX(.92)}}
    .rail-wrap{position:relative;padding-top:13px}
    .rail{
      position:relative;
      height:clamp(82px,18vw,100px);
      display:grid;grid-template-columns:repeat(6,1fr);align-items:center;
      background:var(--rail);border-radius:29px;
      box-shadow:0 13px 34px var(--shadow);
      padding:10px 4px 6px;border:1px solid var(--line);
    }
    .indicator{
      --x:0px;position:absolute;top:-12px;left:0;
      width:clamp(53px,14vw,76px);height:clamp(53px,14vw,76px);
      border-radius:50%;background:#ffcb35;
      transform:translateX(var(--x));
      box-shadow:0 7px 0 rgba(0,0,0,.15),0 12px 22px var(--shadow);
      z-index:0;will-change:transform;
    }
    .indicator:after{content:"";position:absolute;width:18%;height:9%;border-radius:50%;background:rgba(255,255,255,.7);top:16%;left:23%;transform:rotate(-20deg)}
    .tab{
      align-self:stretch;min-width:0;border:0;background:transparent;border-radius:22px;padding:5px 0;
      display:grid;place-items:center;cursor:pointer;position:relative;z-index:1;touch-action:manipulation;
    }
    .tab svg{width:clamp(34px,8.5vw,45px);height:clamp(34px,8.5vw,45px);overflow:visible;transition:transform .45s cubic-bezier(.2,1.6,.3,1)}
    .tab.active svg{transform:translateY(-13px) scale(1.18)}
    .tab:focus-visible{outline:4px solid #5cb9ff;outline-offset:-4px}
    .tab-pop{animation:tabpop .62s cubic-bezier(.18,1.7,.42,1)}
    @keyframes tabpop{0%{transform:translateY(-13px) scale(1.18)}40%{transform:translateY(-24px) scale(1.36) rotate(-9deg)}100%{transform:translateY(-13px) scale(1.18)}}
    .particle{position:fixed;z-index:20;pointer-events:none;width:12px;height:12px;border-radius:50%;animation:burst .8s ease-out forwards}
    @keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(280deg) scale(.15);opacity:0}}
    @media(max-width:390px){.app{padding-left:8px;padding-right:8px}.rail{padding-left:1px;padding-right:1px}.tab svg{width:34px;height:34px}}
    @media(max-height:620px){.app{gap:10px;padding-top:9px}.stage{min-height:300px}.planet-button{width:245px}.rail{height:76px}.indicator{width:52px;height:52px}.tab.active svg{transform:translateY(-10px) scale(1.14)}}
    @media(min-width:760px){.app{padding-top:22px;padding-bottom:22px}.stage{min-height:500px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main class="app">
  <h1 class="sr-only">Solar system planet toy</h1>
  <section class="stage" id="stage" aria-label="Solar system planet toy">
    <div class="scene active" data-scene="sun">
      <div class="scene-bg sun-bg"><i class="orbit one"></i><i class="orbit two"></i></div>
      <button class="planet-button" aria-label="Pop the Sun" data-boop="sun">
        <svg viewBox="0 0 400 400" role="img" aria-label="Smiling golden Sun">
          <g class="planet-art float">
            <g class="sun-ray" fill="#ffad2f"><path d="M200 28 218 77 182 77Z"/><path d="M200 372 218 323 182 323Z"/><path d="m28 200 49-18v36Z"/><path d="m372 200-49-18v36Z"/><path d="m78 78 48 22-26 26Z"/><path d="m322 322-48-22 26-26Z"/><path d="m322 78-22 48-26-26Z"/><path d="m78 322 22-48 26 26Z"/></g>
            <circle cx="200" cy="200" r="119" fill="#ffd54b" stroke="#fff3b0" stroke-width="9"/>
            <circle cx="154" cy="182" r="12" fill="#532d2d"/><circle cx="246" cy="182" r="12" fill="#532d2d"/>
            <path d="M159 229q41 38 82 0" fill="none" stroke="#532d2d" stroke-width="12" stroke-linecap="round"/>
            <circle cx="133" cy="218" r="15" fill="#ff8b58" opacity=".6"/><circle cx="267" cy="218" r="15" fill="#ff8b58" opacity=".6"/>
          </g>
        </svg>
      </button>
    </div>

    <div class="scene" data-scene="earth" hidden>
      <div class="scene-bg earth-bg"><i class="orbit one"></i><i class="orbit two"></i></div>
      <button class="planet-button" aria-label="Pop Earth" data-boop="earth">
        <svg viewBox="0 0 400 400" role="img" aria-label="Smiling blue and green Earth">
          <g class="planet-art float">
            <circle cx="200" cy="200" r="132" fill="#48bff0" stroke="#d9f8ff" stroke-width="9"/>
            <path d="M128 93q36-22 74-18l17 28-24 30-39-4-16 30-56-7q11-37 44-59Zm157 31q37 31 43 72l-34 19-36-17-15-33 14-32Zm-152 108 42-18 38 23 7 50-30 39q-50-4-81-42Z" fill="#62d47e" stroke="#278a59" stroke-width="5" stroke-linejoin="round"/>
            <g class="earth-cloud" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" opacity=".75"><path d="M107 176q32-19 62 0"/><path d="M232 270q31 18 66-2"/></g>
            <circle cx="157" cy="188" r="11" fill="#153554"/><circle cx="243" cy="188" r="11" fill="#153554"/>
            <path d="M165 227q35 33 70 0" fill="none" stroke="#153554" stroke-width="11" stroke-linecap="round"/>
          </g>
        </svg>
      </button>
    </div>

    <div class="scene" data-scene="mars" hidden>
      <div class="scene-bg mars-bg"><i class="orbit one"></i><i class="orbit two"></i></div>
      <button class="planet-button" aria-label="Pop Mars" data-boop="mars">
        <svg viewBox="0 0 400 400" role="img" aria-label="Smiling red Mars">
          <g class="planet-art float">
            <circle cx="200" cy="200" r="128" fill="#ee7652" stroke="#ffc0a6" stroke-width="9"/>
            <circle cx="124" cy="140" r="27" fill="#bf513e"/><circle cx="276" cy="248" r="34" fill="#c4543f"/><circle cx="239" cy="107" r="18" fill="#d55d46"/><circle cx="113" cy="253" r="15" fill="#d55d46"/>
            <path d="M88 193q49-22 94-7m60-56q48 11 74 42" fill="none" stroke="#ff9b72" stroke-width="10" stroke-linecap="round" opacity=".8"/>
            <circle cx="158" cy="190" r="11" fill="#572a34"/><circle cx="242" cy="190" r="11" fill="#572a34"/>
            <path d="M162 230q38 31 76 0" fill="none" stroke="#572a34" stroke-width="11" stroke-linecap="round"/>
          </g>
        </svg>
      </button>
    </div>

    <div class="scene" data-scene="jupiter" hidden>
      <div class="scene-bg jupiter-bg"><i class="orbit one"></i><i class="orbit two"></i></div>
      <button class="planet-button" aria-label="Pop Jupiter" data-boop="jupiter">
        <svg viewBox="0 0 400 400" role="img" aria-label="Smiling striped Jupiter">
          <defs><clipPath id="jClip"><circle cx="200" cy="200" r="137"/></clipPath></defs>
          <g class="planet-art float">
            <circle cx="200" cy="200" r="137" fill="#e8bf83" stroke="#fff0ce" stroke-width="9"/>
            <g clip-path="url(#jClip)" class="jupiter-band" fill="none" stroke-linecap="round"><path d="M50 126q149 31 300 0" stroke="#b96d50" stroke-width="25"/><path d="M48 176q154 27 304 0" stroke="#f8dfac" stroke-width="19"/><path d="M48 243q153-23 304 0" stroke="#aa604b" stroke-width="28"/><path d="M61 286q139-18 278 0" stroke="#f6d7a0" stroke-width="17"/></g>
            <ellipse cx="276" cy="246" rx="34" ry="21" fill="#c75845" stroke="#8b463c" stroke-width="6"/>
            <circle cx="158" cy="183" r="11" fill="#4c3135"/><circle cx="242" cy="183" r="11" fill="#4c3135"/>
            <path d="M161 215q39 35 78 0" fill="none" stroke="#4c3135" stroke-width="11" stroke-linecap="round"/>
          </g>
        </svg>
      </button>
    </div>

    <div class="scene" data-scene="saturn" hidden>
      <div class="scene-bg saturn-bg"><i class="orbit one"></i><i class="orbit two"></i></div>
      <button class="planet-button" aria-label="Pop Saturn" data-boop="saturn">
        <svg viewBox="0 0 400 400" role="img" aria-label="Smiling Saturn with rings">
          <g class="planet-art float">
            <g class="saturn-ring"><ellipse cx="200" cy="207" rx="176" ry="64" fill="none" stroke="#ffe09a" stroke-width="31"/><ellipse cx="200" cy="207" rx="176" ry="64" fill="none" stroke="#b98055" stroke-width="7"/></g>
            <circle cx="200" cy="200" r="106" fill="#f2c768" stroke="#ffefbd" stroke-width="9"/>
            <path d="M108 172q89 24 184 0m-189 61q93 25 194 0" fill="none" stroke="#dca653" stroke-width="14" opacity=".75"/>
            <path d="M45 228q69 39 125 39M230 145q67-1 125-35" fill="none" stroke="#ffe09a" stroke-width="31"/>
            <path d="M45 228q69 39 125 39M230 145q67-1 125-35" fill="none" stroke="#b98055" stroke-width="7"/>
            <circle cx="166" cy="193" r="10" fill="#503a34"/><circle cx="234" cy="193" r="10" fill="#503a34"/>
            <path d="M169 224q31 27 62 0" fill="none" stroke="#503a34" stroke-width="10" stroke-linecap="round"/>
          </g>
        </svg>
      </button>
    </div>

    <div class="scene" data-scene="neptune" hidden>
      <div class="scene-bg neptune-bg"><i class="orbit one"></i><i class="orbit two"></i></div>
      <button class="planet-button" aria-label="Pop Neptune" data-boop="neptune">
        <svg viewBox="0 0 400 400" role="img" aria-label="Smiling deep blue Neptune">
          <g class="planet-art float">
            <circle cx="200" cy="200" r="128" fill="#4778ef" stroke="#b9d2ff" stroke-width="9"/>
            <path d="M79 155q121 31 242 0M74 235q127-27 252 0M95 282q106-19 210 0" fill="none" stroke="#72a4ff" stroke-width="19" stroke-linecap="round" opacity=".82"/>
            <ellipse class="neptune-storm" cx="278" cy="145" rx="32" ry="18" fill="#2550b8"/>
            <circle cx="158" cy="190" r="11" fill="#102957"/><circle cx="242" cy="190" r="11" fill="#102957"/>
            <path d="M162 228q38 32 76 0" fill="none" stroke="#102957" stroke-width="11" stroke-linecap="round"/>
          </g>
        </svg>
      </button>
    </div>
  </section>

  <nav class="rail-wrap" aria-label="Choose the Sun or a planet">
    <div class="rail" id="rail">
      <div class="indicator" id="indicator" aria-hidden="true"></div>
      <button class="tab active" data-tab="sun" aria-label="Sun" aria-pressed="true"><svg viewBox="0 0 48 48" aria-hidden="true"><g fill="#ffad2f"><path d="M24 1l4 9h-8Zm0 46 4-9h-8ZM1 24l9-4v8Zm46 0-9-4v8ZM7 7l9 4-5 5Zm34 34-9-4 5-5Zm0-34-4 9-5-5ZM7 41l4-9 5 5Z"/></g><circle cx="24" cy="24" r="14" fill="#ffd54b" stroke="#6b3c2a" stroke-width="3"/></svg></button>
      <button class="tab" data-tab="earth" aria-label="Earth" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19" fill="#48bff0" stroke="#18314d" stroke-width="3"/><path d="m11 13 10-5 5 6-4 7-9-1Zm21 9 7-5 4 8-5 8-8-3ZM14 28l9-3 6 5-3 12-9-4Z" fill="#62d47e"/></svg></button>
      <button class="tab" data-tab="mars" aria-label="Mars" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19" fill="#ee7652" stroke="#572a34" stroke-width="3"/><circle cx="15" cy="18" r="4" fill="#bf513e"/><circle cx="31" cy="31" r="5" fill="#bf513e"/><circle cx="31" cy="12" r="2.5" fill="#d55d46"/></svg></button>
      <button class="tab" data-tab="jupiter" aria-label="Jupiter" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="#e8bf83" stroke="#50353a" stroke-width="3"/><path d="M6 16q18 5 36 0M5 25q19 5 38 0M8 34q16-4 32 0" fill="none" stroke="#b96d50" stroke-width="4"/><ellipse cx="33" cy="29" rx="5" ry="3" fill="#c75845"/></svg></button>
      <button class="tab" data-tab="saturn" aria-label="Saturn" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="25" rx="23" ry="8" fill="none" stroke="#b98055" stroke-width="6"/><circle cx="24" cy="23" r="14" fill="#f2c768" stroke="#503a34" stroke-width="3"/><path d="M3 27q9 6 18 6m7-17q10-1 17-6" fill="none" stroke="#ffe09a" stroke-width="6"/></svg></button>
      <button class="tab" data-tab="neptune" aria-label="Neptune" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19" fill="#4778ef" stroke="#102957" stroke-width="3"/><path d="M7 18q17 5 34 0M6 27q18-4 36 0M10 35q14-3 28 0" fill="none" stroke="#8eb2ff" stroke-width="4"/></svg></button>
    </div>
  </nav>
</main>
<script>
(function(){
  var tabs=Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var scenes=Array.prototype.slice.call(document.querySelectorAll('.scene'));
  var indicator=document.getElementById('indicator');
  var rail=document.getElementById('rail');
  var stage=document.getElementById('stage');
  var selected=0,x=0,v=0,target=0,running=false,audio=null;
  var colors=['#ffd54b','#48bff0','#ee7652','#e8bf83','#f2c768','#4778ef'];
  var palettes={
    sun:['#ffd54b','#ff9d2e','#fff2a8'],earth:['#48bff0','#62d47e','#d9f8ff'],mars:['#ee7652','#bf513e','#ffc0a6'],
    jupiter:['#e8bf83','#b96d50','#f8dfac'],saturn:['#f2c768','#ffe09a','#b98055'],neptune:['#4778ef','#72a4ff','#b9d2ff']
  };
  var notes={sun:[392,523,659],earth:[330,440,554],mars:[196,262,330],jupiter:[147,196,294],saturn:[220,330,440],neptune:[277,370,554]};
  function measure(){
    var tab=tabs[selected],rr=rail.getBoundingClientRect(),tr=tab.getBoundingClientRect(),ir=indicator.getBoundingClientRect();
    target=tr.left-rr.left+(tr.width-ir.width)/2;
    if(!running){x=target;indicator.style.setProperty('--x',x+'px')}
  }
  function animate(){
    var force=(target-x)*.14;v=(v+force)*.7;x+=v;indicator.style.setProperty('--x',x+'px');
    if(Math.abs(target-x)>.1||Math.abs(v)>.1){requestAnimationFrame(animate)}else{x=target;v=0;running=false;indicator.style.setProperty('--x',x+'px')}
  }
  function spring(){if(!running){running=true;requestAnimationFrame(animate)}}
  function tone(kind){
    try{
      audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();
      var now=audio.currentTime;
      notes[kind].forEach(function(freq,i){
        var o=audio.createOscillator(),g=audio.createGain();o.type=kind==='jupiter'?'triangle':kind==='mars'?'square':'sine';
        o.frequency.setValueAtTime(freq,now+i*.08);if(kind==='sun'||kind==='neptune')o.frequency.exponentialRampToValueAtTime(freq*1.28,now+i*.08+.2);
        g.gain.setValueAtTime(.0001,now+i*.08);g.gain.exponentialRampToValueAtTime(.09,now+i*.08+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.08+.24);
        o.connect(g);g.connect(audio.destination);o.start(now+i*.08);o.stop(now+i*.08+.25);
      });
    }catch(e){}
  }
  function burstAt(el,kind,count){
    var r=el.getBoundingClientRect(),palette=palettes[kind],total=count||10;
    for(var i=0;i<total;i++){
      var p=document.createElement('i'),a=(Math.PI*2*i/total)+Math.random()*.3,d=50+Math.random()*75;
      p.className='particle';p.style.left=(r.left+r.width/2-6)+'px';p.style.top=(r.top+r.height*.36)+'px';p.style.background=palette[i%palette.length];
      if(kind==='saturn'){p.style.width='17px';p.style.height='7px';p.style.borderRadius='50%'}else if(kind==='sun'&&i%2===0){p.style.borderRadius='2px';p.style.transform='rotate(45deg)'}
      p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(p);
      setTimeout(function(node){return function(){node.remove()}}(p),850);
    }
  }
  function select(i,withSound){
    selected=i;
    tabs.forEach(function(t,n){t.classList.toggle('active',n===i);t.setAttribute('aria-pressed',n===i?'true':'false')});
    scenes.forEach(function(s,n){var on=n===i;s.classList.toggle('active',on);s.hidden=!on});
    indicator.style.background=colors[i];measure();spring();
    var svg=tabs[i].querySelector('svg');svg.classList.remove('tab-pop');void svg.offsetWidth;svg.classList.add('tab-pop');
    burstAt(tabs[i],tabs[i].dataset.tab,8);if(withSound)tone(tabs[i].dataset.tab);
  }
  tabs.forEach(function(tab,i){tab.addEventListener('click',function(){select(i,true)})});
  document.querySelectorAll('[data-boop]').forEach(function(btn){btn.addEventListener('click',function(){
